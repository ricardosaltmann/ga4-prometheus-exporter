server:
  listen_address: "0.0.0.0"
  port: 9674

logging:
  level: "INFO"
  format: "text"

google:
  credentials_file: "/run/secrets/ga4.json"
  timeout_seconds: 30

properties:
  - name: "meu_portal"
    property_id: "123456789"
    enabled: true

collection:
  realtime:
    enabled: true
    interval_seconds: 30
  core:
    enabled: true
    interval_seconds: 120
    date_range:
      start_date: "today"
      end_date: "today"

cache:
  stale_after_seconds: 900

prometheus:
  include_property_id_label: false
  max_series_per_query: 100

quota:
  enabled: true

metrics:
  realtime:
    - name: "activeUsers"
      prometheus_name: "ga4_realtime_active_users"

  core:
    - name: "activeUsers"
      prometheus_name: "ga4_active_users"
    - name: "totalUsers"
      prometheus_name: "ga4_total_users"
    - name: "newUsers"
      prometheus_name: "ga4_new_users"
    - name: "sessions"
      prometheus_name: "ga4_sessions"
    - name: "engagedSessions"
      prometheus_name: "ga4_engaged_sessions"
    - name: "screenPageViews"
      prometheus_name: "ga4_screen_page_views"
    - name: "eventCount"
      prometheus_name: "ga4_total_event_count"
    - name: "engagementRate"
      prometheus_name: "ga4_engagement_rate"
    - name: "bounceRate"
      prometheus_name: "ga4_bounce_rate"
    - name: "averageSessionDuration"
      prometheus_name: "ga4_average_session_duration_seconds"
    - name: "userEngagementDuration"
      prometheus_name: "ga4_user_engagement_duration_seconds"
    - name: "screenPageViewsPerSession"
      prometheus_name: "ga4_screen_page_views_per_session"
    - name: "scrolledUsers"
      prometheus_name: "ga4_scrolled_users"

  devices:
    enabled: true
    limit: 10

  traffic_channels:
    enabled: true
    limit: 10

  realtime_devices:
    enabled: true
    limit: 10

  realtime_screens:
    enabled: true
    limit: 10

  top_pages:
    enabled: true
    dimension: "pagePath"
    metric: "screenPageViews"
    limit: 10

  events:
    - name: "page_view"
      enabled: true
    - name: "session_start"
      enabled: true
    - name: "first_visit"
      enabled: true
    - name: "scroll"
      enabled: true
    - name: "user_engagement"
      enabled: true
    - name: "form_start"
      enabled: true
    - name: "form_submit"
      enabled: true
    - name: "view_search_results"
      enabled: true
