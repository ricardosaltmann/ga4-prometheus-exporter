services:
  ga4-exporter:
    image: ricardoaltmann/ga4-exporter:latest
    container_name: poc-ga4-exporter
    restart: unless-stopped
    ports:
      - "9674:9674"
    volumes:
      - ./config.poc.yaml:/etc/ga4-exporter/config.yaml:ro
      - ../secrets/ga4.json:/run/secrets/ga4.json:ro
      - ../src/ga4_exporter:/app/src/ga4_exporter:ro
    environment:
      - GA4_CONFIG=/etc/ga4-exporter/config.yaml
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/ga4.json
      - GA4_LOG_LEVEL=INFO
    networks:
      - poc-network

  prometheus:
    image: prom/prometheus:latest
    container_name: poc-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - poc-network
    depends_on:
      - ga4-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: poc-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=marcusolsson-dynamictext-panel,volkovlabs-echarts-panel,volkovlabs-variable-panel,volkovlabs-table-panel
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - poc-network
    depends_on:
      - prometheus

networks:
  poc-network:
    driver: bridge
