[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ga4-prometheus-exporter"
version = "1.2.0"
description = "Production-grade Prometheus Exporter for Google Analytics 4 (GA4) using the Google Analytics Data API v1"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Observability Engineering Team" }
]
dependencies = [
    "google-analytics-data>=0.18.0",
    "google-auth>=2.28.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "PyYAML>=6.0.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
ga4-exporter = "ga4_exporter.main:cli_entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/ga4_exporter"]

[tool.ruff]

line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "B026"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
